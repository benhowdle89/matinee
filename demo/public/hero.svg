<rect width="100%" height="100%" fill="#faf8f4"/>
<style>
.hw-text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.hw-typed{clip-path:inset(0 0 0 0)}
.hw-caret{opacity:0}
@media (prefers-reduced-motion: no-preference){
.hw-typed{animation:hw-type 6410ms linear infinite}
.hw-caret{animation:hw-caret 6410ms steps(1,end) infinite,hw-caret-x 6410ms linear infinite}
}
@keyframes hw-type{
0%,17.473%{clip-path:inset(0 100% 0 0)}
39.002%{clip-path:inset(0 0 0 0)}
100%{clip-path:inset(0 0 0 0)}
}
@keyframes hw-caret{
0%,16.381%{opacity:0}
17.473%{opacity:1}
39.938%{opacity:1}
40.874%,100%{opacity:0}
}
/* The caret rides the end of the text rather than waiting at the far end of
   the field, in lockstep with the reveal above. */
@keyframes hw-caret-x{
0%,17.473%{transform:translateX(-148px)}
39.002%{transform:translateX(0)}
100%{transform:translateX(0)}
}
</style>

