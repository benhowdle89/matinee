# Cloudflare Pages config for the demo site, live at https://matinee.pages.dev
#
# Deploys happen automatically. The Pages project is connected to
# benhowdle89/matinee in the Cloudflare dashboard, so every push to main builds
# and ships:
#
#   Build command:  npm run demo:build
#   Build output:   demo/dist
#   Branch:         main, automatic deployments enabled
#
# That route needs no API token stored in GitHub, which is why it is preferred
# over a deploy step in Actions.
#
# To ship by hand anyway (a hotfix, or from a branch):
#   npm run demo:build && npx wrangler pages deploy demo/dist --project-name matinee
#
# The demo is served from the root of the domain, so it builds with Vite's
# default base. demo/vite.config.ts reads DEMO_BASE if it ever needs a subpath.
# The absolute og:image URL is a constant in demo/vite.config.ts, overridable
# with a VITE_SITE_ORIGIN env var. It has to change if the site moves to a
# custom domain.

name = "matinee"
compatibility_date = "2026-08-05"
pages_build_output_dir = "demo/dist"
