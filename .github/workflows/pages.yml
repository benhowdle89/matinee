name: Demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let a running deploy finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub Pages needs a public repo on the free plan, so skip cleanly while
    # this one is private rather than failing every push. Flipping the repo to
    # public is all that's needed to start deploying again.
    if: github.event.repository.visibility == 'public'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install -g "npm@^11.5.1"
      - run: npm ci

      # A project site is served from /<repo>/, not from the root. Vite bakes
      # this into every asset URL at build time, so it has to be set here.
      - run: npm run demo:build
        env:
          DEMO_BASE: /matinee/

      # `enablement: true` needs admin rights the default workflow token does
      # not have, so Pages is enabled once out of band instead:
      #   gh api -X POST repos/benhowdle89/matinee/pages -f build_type=workflow
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

      - id: deploy
        uses: actions/deploy-pages@v4
