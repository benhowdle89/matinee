name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm 11 gates package install scripts. esbuild's postinstall fetches its
      # platform binary, without which tsup and vite cannot run at all.
      - run: npm install -g "npm@^11.5.1"
      - run: npm ci

      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: Check the published package stays small and clean
        run: |
          set -euo pipefail
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          if grep -qE 'dist/(demo|test)|\.test\.' /tmp/pack.txt; then
            echo "::error::test or demo files leaked into the tarball"
            exit 1
          fi

      - name: Assert there are no runtime dependencies
        run: |
          set -euo pipefail
          DEPS="$(node -p "Object.keys(require('./package.json').dependencies || {}).length")"
          if [ "$DEPS" != "0" ]; then
            echo "::error::matinee ships $DEPS runtime dependencies; it ships zero"
            exit 1
          fi
