name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm 11 gates package install scripts. esbuild's postinstall fetches its
      # platform binary, without which tsup and vite cannot run at all.
      - run: npm install -g "npm@^11.5.1"
      - run: npm ci

      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      # Packs the tarball, installs it into a throwaway project and uses it the
      # way a consumer does: ESM and CJS entry points, the styles.css subpath,
      # the shipped .d.ts, server rendering, and the dependency list. The unit
      # suite imports from ./src and so proves none of that.
      - run: npm run verify

      # The machine-readable docs embed the shipped .d.ts verbatim, so they go
      # stale the moment the API changes. Regenerate and fail if the result
      # differs from what is committed.
      - name: Check llms.txt is current
        run: |
          set -euo pipefail
          node scripts/make-llms.mjs
          if ! git diff --quiet -- llms.txt demo/public/llms.txt demo/public/llms-full.txt; then
            echo "::error::llms.txt is out of date. Run 'npm run llms' and commit the result."
            git diff --stat -- llms.txt demo/public/
            exit 1
          fi

      - run: npm run demo:build
