name: Release

# Publishes whatever is tagged. Cut a release with:
#   npm version minor && git push --follow-tags
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # write, not read: the final step cuts the GitHub release.
      contents: write
      # Required for npm provenance. This is what earns the "Provenance"
      # badge on npmjs.com and cryptographically ties the tarball to this repo.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm 11.5.1 or newer. Node 20 ships
      # 10.8.x, which falls back to token auth and then trips over 2FA.
      #
      # Pinned to the 11.x line rather than `latest`: npm 12 requires Node 22+,
      # so `latest` fails here with EBADENGINE.
      - run: npm install -g "npm@^11.5.1"
      - run: npm --version
      - run: npm ci

      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run verify

      - name: Verify the tag matches package.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "releasing v$PKG"

      # No NODE_AUTH_TOKEN: the trusted publisher configured on npmjs.com lets
      # npm exchange this job's OIDC identity for a short-lived credential.
      # Nothing to leak, nothing to rotate, and package-level 2FA does not
      # apply because there is no long-lived token involved.
      #
      # One-time setup, in the web UI while signed in:
      #   npmjs.com/package/matinee/access -> Trusted publisher
      #   repository benhowdle89/matinee, workflow release.yml
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
